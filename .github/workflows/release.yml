# Publishes a signed APK to GitHub Releases when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The release asset is what a tablet installs from (browser, GitHub app, or Obtainium).
#
# Every published APK must be signed with the same key and carry a higher versionCode than the last,
# or the tablet refuses the update and the only fix is an uninstall, which wipes the PIN and rules.
# The key is the shared one committed in app/signing/ (see DECISIONS.md); the tag sets the version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Minor and patch stay under 100 so versionCode = major*10000 + minor*100 + patch keeps rising.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3, with minor and patch below 100."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          echo "VERSION_NAME=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list includes the long-removed `tools` package, which fails sdkmanager.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ./gradlew assembleRelease -Pappgate.versionCode="$VERSION_CODE" -Pappgate.versionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "appgate-$VERSION_NAME.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "appgate-$VERSION_NAME.apk" \
            --title "AppGate $VERSION_NAME" --generate-notes
