# Publishes a signed APK to GitHub Releases, started either way:
#   - push a version tag: git tag v0.2.0 && git push origin v0.2.0
#   - or Actions > Release > Run workflow, version 0.2.0. The release then creates the v0.2.0 tag on the
#     chosen branch's head. Exists because a phone, or a session that can't push tags, can still do this.
# The release asset is what a tablet installs from: the in-app "Download latest AppGate" button.
#
# Every published APK must be signed with the same key and carry a higher versionCode than the last,
# or the tablet refuses the update and the only fix is an uninstall, which wipes the PIN and rules.
# The key is the shared one committed in app/signing/ (see DECISIONS.md); the tag sets the version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0 (becomes tag v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag
        run: |
          # Minor and patch stay under 100 so versionCode = major*10000 + minor*100 + patch keeps rising.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3, with minor and patch below 100."
            exit 1
          fi
          major=${BASH_REMATCH[1]}; minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          echo "VERSION_NAME=$major.$minor.$patch" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list includes the long-removed `tools` package, which fails sdkmanager.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ./gradlew assembleRelease -Pappgate.versionCode="$VERSION_CODE" -Pappgate.versionName="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "appgate-$VERSION_NAME.apk"
          # Fixed name for the in-app "Download latest AppGate" link (releases/latest/download/appgate.apk).
          cp app/build/outputs/apk/release/app-release.apk appgate.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target only matters for a manual run, where the tag doesn't exist yet and is created here.
          gh release create "$TAG" "appgate-$VERSION_NAME.apk" appgate.apk --target "$GITHUB_SHA" \
            --title "AppGate $VERSION_NAME" --generate-notes
