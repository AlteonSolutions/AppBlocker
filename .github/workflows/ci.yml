# Runs on every branch, not just the trunk: two of the four source projects had no CI at all and
# their only real regression check ran against nothing automatically.
#
# The `test` job is the gate. Any deploy job you add must declare `needs: test`. There is none today:
# AppGate is sideloaded, so the debug APK is uploaded as a workflow artifact instead.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # release.yml runs this job as its gate, so publishing a release `needs: test`.
  workflow_call:

# github.workflow is the caller's name when called, so a tag push's own CI run and the Release run's
# call of this workflow don't share a group and cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle-wrapper.jar is an executable binary in the repo; fail if it isn't a published Gradle release.
      - uses: gradle/actions/wrapper-validation@v4

      # JDK 17 must equal compileOptions and kotlinOptions.jvmTarget in app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the command-line tools and accepts licenses, so AGP can fetch platform 35 and build-tools.
      # The action's default package list includes the long-removed `tools` package, which fails sdkmanager.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew test assembleDebug

      - name: Lint
        run: ./gradlew lintDebug

      # Exercises the release path every push, with a throwaway key generated here (not a secret: it
      # exists for one run and signs nothing published). Catches a broken signingConfig, version
      # properties or R8 shrinking now, rather than on the day a release is tagged.
      - name: Release build signs with a supplied key
        env:
          APPGATE_KEYSTORE_FILE: ${{ runner.temp }}/ci-throwaway.jks
          APPGATE_KEYSTORE_PASSWORD: throwaway
          APPGATE_KEY_ALIAS: ci
          APPGATE_KEY_PASSWORD: throwaway
        run: |
          keytool -genkeypair -keystore "$APPGATE_KEYSTORE_FILE" -alias ci -keyalg RSA -keysize 2048 \
            -validity 1 -storepass throwaway -keypass throwaway -dname "CN=AppGate CI throwaway"
          ./gradlew assembleRelease -Pappgate.versionCode=10203 -Pappgate.versionName=1.2.3
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee signing.txt
          grep -q "CN=AppGate CI throwaway" signing.txt
          "$BT/aapt" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "versionCode='10203' versionName='1.2.3'" badging.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
